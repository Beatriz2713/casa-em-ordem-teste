{% extends "base.html" %}

{% block title %}
Nova tarefa | Casa em Ordem
{% endblock %}

{% block content %}

<div class="pagina-cabecalho">

    <div>
        <span class="etiqueta">TAREFAS</span>

        <h1>Nova tarefa</h1>

        <p>
            Cadastre uma nova responsabilidade para a família.
        </p>
    </div>

</div>


<div class="painel formulario-painel">

    <form method="POST">

        <div class="campo">
            <label for="nome">Nome da tarefa</label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex.: Varrer a casa"
                required
            >
        </div>


        <div class="campo">
            <label for="descricao">Descrição</label>

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva a tarefa, se necessário"
                rows="4"
            ></textarea>
        </div>


        <div class="campo">
            <label for="tipo">Tipo de tarefa</label>

            <select id="tipo" name="tipo" required>

                <option value="REGULAR">
                    Regular
                </option>

                <option value="EXTRA">
                    Extra
                </option>

            </select>
        </div>


        <div class="campo">

            <label>
                Participa do rodízio?
            </label>

            <select name="participa_rodizio" required>

                <option value="1">
                    Sim
                </option>

                <option value="0">
                    Não
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="peso">
                Peso da tarefa
            </label>

            <input
                type="number"
                id="peso"
                name="peso"
                value="1"
                min="0.1"
                step="0.1"
                required
            >

            <small>
                Use um valor maior para tarefas mais pesadas.
            </small>

        </div>


        <div class="formulario-acoes">

            <a href="{{ url_for('tarefas') }}" class="botao-secundario">
                Cancelar
            </a>

            <button type="submit" class="botao-principal">
                Cadastrar tarefa
            </button>

        </div>

    </form>

</div>

{% endblock %}
