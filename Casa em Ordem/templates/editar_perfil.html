{% extends "base.html" %}

{% block title %}Editar Perfil | Casa em Ordem{% endblock %}

{% block content %}

<div class="pagina">

    <div class="cabecalho-pagina">
        <span class="etiqueta">MEU PERFIL</span>

        <h1>Editar meus dados</h1>

        <p>
            Altere as informações da sua conta.
        </p>
    </div>


    <div class="card-editar-perfil">

        <form method="POST">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ usuario['nome'] }}"
                    required
                >
            </div>


            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ usuario['email'] }}"
                    required
                >
            </div>


            <div class="botoes-perfil">

                <a
                    href="{{ url_for('perfil') }}"
                    class="botao-cancelar"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="botao-salvar"
                >
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
