
{% extends "base.html" %}

{% block title %}Cadastrar produto{% endblock %}

{% block content %}
<div class="container">
    <h1>Cadastrar produto</h1>
    <p>Adicione um produto ao catálogo da sua família.</p>

    <form method="POST" action="{{ url_for('novo_produto') }}">

        <div class="form-group">
            <label for="nome">Nome do produto</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex.: Arroz"
                required
            >
        </div>

        <div class="form-group">
            <label for="id_categoria">Categoria</label>
            <select id="id_categoria" name="id_categoria" required>
                <option value="">Selecione uma categoria</option>

                {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}">
                        {{ categoria.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="unidade_medida">Unidade de medida</label>
            <select id="unidade_medida" name="unidade_medida" required>
                <option value="">Selecione</option>
                <option value="unidade">Unidade</option>
                <option value="kg">Quilograma (kg)</option>
                <option value="g">Grama (g)</option>
                <option value="litro">Litro (L)</option>
                <option value="ml">Mililitro (ml)</option>
                <option value="pacote">Pacote</option>
                <option value="caixa">Caixa</option>
                <option value="frasco">Frasco</option>
                <option value="lata">Lata</option>
                <option value="rolo">Rolo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantidade_atual">Quantidade atual</label>
            <input
                type="number"
                id="quantidade_atual"
                name="quantidade_atual"
                min="0"
                step="0.01"
                value="0"
                required
            >
        </div>

        <div class="form-group">
            <label>Controlar estoque?</label>
            <select name="controla_estoque" required>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantidade_minima">
                Quantidade mínima (opcional)
            </label>
            <input
                type="number"
                id="quantidade_minima"
                name="quantidade_minima"
                min="0"
                step="0.01"
                placeholder="Ex.: 2"
            >
        </div>

        <div class="form-actions">
            <a href="{{ url_for('produtos') }}" class="btn-cancelar">
                Cancelar
            </a>

            <button type="submit" class="btn-salvar">
                Cadastrar produto
            </button>
        </div>

    </form>
</div>
{% endblock %}
