{% extends "base.html" %}

{% block title %}Alterar Senha | Casa em Ordem{% endblock %}

{% block content %}

<div class="pagina">

    <div class="cabecalho-pagina">
        <span class="etiqueta">SEGURANÇA</span>

        <h1>Alterar senha</h1>

        <p>
            Atualize a senha da sua conta para manter seu acesso seguro.
        </p>
    </div>


    <div class="card-editar-perfil">

        <form method="POST">

            <div class="campo">
                <label for="senha_atual">
                    Senha atual
                </label>

                <input
                    type="password"
                    id="senha_atual"
                    name="senha_atual"
                    placeholder="Digite sua senha atual"
                    required
                >
            </div>


            <div class="campo">
                <label for="nova_senha">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="nova_senha"
                    name="nova_senha"
                    placeholder="Digite a nova senha"
                    required
                >
            </div>


            <div class="campo">
                <label for="confirmar_senha">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Digite novamente a nova senha"
                    required
                >
            </div>


            <div class="botoes-perfil">

                <a
                    href="{{ url_for('perfil') }}"
                    class="botao-cancelar"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="botao-salvar"
                >
                    Alterar senha
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
